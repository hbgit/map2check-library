language = "C"
header = "/* SPDX-License-Identifier: GPL-3.0-only */"
include_guard = "__MAP2CHECK_H_INCLUDED__"
autogen_warning = "/* Warning: this file is autogenerated by cbindgen. Do not modify manually. */"
tab_width = 2
documentation = true
documentation_style = "doxy"

[export]
prefix = ""
include = ["ViolatedProperty"]
exclude = ["ViolatedPropertyRaw"]

[parse]
parse_deps = false

# `write_property` takes the C enum as its `int` (ViolatedPropertyRaw, so an
# out-of-range value is defined behaviour); the header keeps the C runtime's
# parameter type `enum ViolatedProperty`.
[export.rename]
"ViolatedPropertyRaw" = "enum ViolatedProperty"
