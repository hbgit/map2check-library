[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "GPL-3.0-only",
]
deny = ["GPL-2.0-only"]

[advisories]
ignore = []

[bans]
multiple-versions = "warn"
deny = [
    { name = "openssl" },
]
